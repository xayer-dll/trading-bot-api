services:
  - type: web
    name: trading-bot-api
    runtime: python
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn api:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: API_KEY
        sync: false
      - key: API_SECRET
        sync: false
      - key: FUTURES_API_KEY
        sync: false
      - key: FUTURES_API_SECRET
        sync: false
      - key: FUTURES_ENABLED
        value: "true"
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_ENABLED
        value: "true"
      - key: AUTO_START
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.0"
